services:
  cmdb-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: cmdb-mcp-server
    restart: unless-stopped
    ports:
      - "8061:8061"
    environment:
      - MCP_USE_MOCK=${MCP_USE_MOCK:-false}
      - MCP_API_BASE_URL=${MCP_API_BASE_URL:-https://oss.tech.ctseelink.cn}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # 服务器不写文件日志，走 Docker json-file 自动轮转（100m x 5）
      - LOG_TO_FILE=false
    volumes:
      - ../config:/app/config:ro
      - ../mock:/app/mock:ro
      - cmdb-mcp-logs:/app/logs
    networks:
      - cmdb-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

networks:
  cmdb-network:
    driver: bridge

volumes:
  cmdb-mcp-logs:
