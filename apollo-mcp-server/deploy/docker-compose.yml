services:
  apollo-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: apollo-mcp-server
    restart: unless-stopped
    # 复用宿主机网络：容器内 DNS/路由/hosts 与宿主机一致，
    # 解决容器无法访问内网域名（easyops/各套 Apollo）的问题
    network_mode: host
    environment:
      # 生产环境配置
      - MCP_USE_MOCK=${MCP_USE_MOCK:-false}
      # Apollo OpenAPI 统一服务地址（查询配置/应用列表共用）
      - APOLLO_OPENAPI_HOST=${APOLLO_OPENAPI_HOST:-http://apollo-config.tech.ctseelink.cn:8070}
      # Apollo OpenAPI Token（从环境变量注入，不要写入镜像）
      - APOLLO_OPENAPI_TOKEN=${APOLLO_OPENAPI_TOKEN:-}
      # 第三方「Apollo Host 信息查询接口」配置（推荐方式，默认值已内置在代码中）
      - APOLLO_HOST_API_BASE=${APOLLO_HOST_API_BASE:-}
      - APOLLO_HOST_SESSION_ID=${APOLLO_HOST_SESSION_ID:-}
      - APOLLO_HOST_NAME=${APOLLO_HOST_NAME:-}
      - APOLLO_HOST_PORT_OVERRIDE=${APOLLO_HOST_PORT_OVERRIDE:-}
      # 日志级别
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../config:/app/config:ro
      - ../mock:/app/mock:ro
      - apollo-mcp-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # 开发/测试环境（Mock 模式）
  apollo-mcp-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: apollo-mcp-mock
    restart: unless-stopped
    ports:
      - "8063:8062"
    environment:
      - MCP_USE_MOCK=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ../config:/app/config:ro
      - ../mock:/app/mock:ro
      - apollo-mcp-mock-logs:/app/logs
    networks:
      - apollo-network
    profiles:
      - mock

networks:
  apollo-network:
    driver: bridge

volumes:
  apollo-mcp-logs:
  apollo-mcp-mock-logs: