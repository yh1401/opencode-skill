services:
  apollo-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: apollo-mcp-server
    restart: unless-stopped
    ports:
      - "8062:8062"
    environment:
      # 生产环境配置
      - MCP_USE_MOCK=${MCP_USE_MOCK:-false}
      # Apollo 生产环境
      - APOLLO_CONFIG_HOST=${APOLLO_CONFIG_HOST:-http://apollo-config.tech.ctseelink.cn:8080}
      - APOLLO_OPENAPI_HOST=${APOLLO_OPENAPI_HOST:-http://apollo-config.tech.ctseelink.cn:8070}
      # Apollo OpenAPI Token（从环境变量注入，不要写入镜像）
      - APOLLO_OPENAPI_TOKEN=${APOLLO_OPENAPI_TOKEN:-}
      # 日志级别
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ../config:/app/config:ro
      - ../mock:/app/mock:ro
      - ../logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8062/health').raise_for_status()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - apollo-network
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  # 开发/测试环境（Mock 模式）
  apollo-mcp-mock:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: apollo-mcp-mock
    restart: unless-stopped
    ports:
      - "8063:8062"
    environment:
      - MCP_USE_MOCK=true
      - LOG_LEVEL=DEBUG
    volumes:
      - ../config:/app/config:ro
      - ../mock:/app/mock:ro
      - ../logs:/app/logs
    networks:
      - apollo-network
    profiles:
      - mock

networks:
  apollo-network:
    driver: bridge